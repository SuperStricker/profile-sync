name: Naukri Profile Auto-Sync

on:
  # Scheduled exact-time triggers are handled by Cloudflare Worker (naukri-cloud-scheduler)
  # at 08:55 AM & 09:10 AM IST daily (25,40 3 * * * UTC) via workflow_dispatch
  # to eliminate GitHub Actions cron queue delays.
  workflow_dispatch: # Triggered by Cloudflare Cron Worker & manual runs

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync-naukri:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Install xvfb (Virtual Framebuffer for headed browser emulation)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Naukri Profile Sync
        env:
          NAUKRI_SESSION_JSON: ${{ secrets.NAUKRI_SESSION_JSON }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        # xvfb-run runs Chromium in non-headless GUI mode inside a virtual display buffer
        # This bypasses Akamai's headless detection
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node update-profile.js

      - name: Upload Verification Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-profile-updated
          path: naukri-profile-updated.png
          if-no-files-found: ignore
          retention-days: 7
